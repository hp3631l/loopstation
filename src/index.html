<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beatbox Loopstation</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="chassis">
      <!-- Top Hardware Console -->
      <header class="master-console">
        <!-- Brand & Machine Spec -->
        <div class="brand-panel">
          <div class="power-led" id="engine-status" title="Audio Engine Status"></div>
          <div class="brand-text">
            <span class="brand-name">RC-BEATBOX</span>
            <span class="brand-sub">4-CHANNEL LIVE LOOP STATION</span>
          </div>
        </div>

        <!-- Master LCD & Meter Pod -->
        <div class="console-center">
          <!-- Master Loop LCD Display -->
          <div class="lcd-screen">
            <div class="lcd-header">
              <span class="lcd-title">MASTER LOOP</span>
              <span class="lcd-indicator" id="master-sync-state">FREE-RUN</span>
            </div>
            <div class="lcd-time" id="master-time">0.00s</div>
          </div>

          <!-- Mic Input Section with Peak LED Ladder -->
          <div class="mic-channel-pod">
            <span class="pod-tag">MIC INPUT</span>
            <div class="meter-and-knob">
              <div class="led-ladder" id="mic-ladder">
                <div class="ladder-dot dot-red"></div>
                <div class="ladder-dot dot-yellow"></div>
                <div class="ladder-dot dot-yellow"></div>
                <div class="ladder-dot dot-green"></div>
                <div class="ladder-dot dot-green"></div>
                <div class="ladder-dot dot-green"></div>
              </div>
              <div class="knob-control">
                <input type="range" id="input-gain" min="0" max="2" step="0.05" value="1" title="Mic Gain" />
                <span class="control-readout" id="gain-val">1.0x</span>
              </div>
            </div>
          </div>

          <!-- Headphone Monitor Section -->
          <div class="monitor-pod">
            <div class="pod-top-row">
              <span class="pod-tag">PHONES</span>
              <button class="hardware-toggle active" id="monitor-toggle">CUE ON</button>
            </div>
            <div class="knob-control">
              <input type="range" id="monitor-vol" min="0" max="1.5" step="0.05" value="1" title="Monitor Level" />
              <span class="control-readout" id="monitor-val">100%</span>
            </div>
          </div>

          <!-- Hardware Device Routing Inset -->
          <div class="routing-inset">
            <div class="routing-row">
              <span class="route-label">IN</span>
              <select id="mic-select" class="hw-select" title="Microphone Input"></select>
            </div>
            <div class="routing-row">
              <span class="route-label">OUT</span>
              <select id="speaker-select" class="hw-select" title="Monitor Output"></select>
            </div>
            <div class="routing-row">
              <span class="route-label">BUF</span>
              <select id="buffer-size-select" class="hw-select" title="Buffer Size">
                <option value="128">128 (~2.7ms)</option>
                <option value="256" selected>256 (~5.3ms)</option>
                <option value="512">512 (~10.7ms)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Master Performance Pads -->
        <div class="master-action-pads">
          <button class="master-punch-pad stop-all-pad" id="master-play-btn" title="Stop All Playback (ESC)">
            <span class="pad-symbol">■</span>
            <span class="pad-label">STOP ALL</span>
            <span class="pad-key">[ESC]</span>
          </button>
          <button class="master-punch-pad clear-all-pad" id="clear-all-btn" title="Clear All Tracks (Shift+C)">
            <span class="pad-symbol">↺</span>
            <span class="pad-label">CLEAR ALL</span>
            <span class="pad-key">[⇧C]</span>
          </button>
        </div>
      </header>

      <!-- 4 Channel Strips Grid -->
      <main class="channels-deck" id="tracks-container">
        <!-- Rendered dynamically by main.js with realistic hardware channel architecture -->
      </main>

      <!-- Bottom Hardware Status & Key Guide -->
      <footer class="console-footer">
        <div class="footer-shortcuts">
          <span class="key-shortcut"><span class="key-cap">1-4</span> Select</span>
          <span class="key-shortcut"><span class="key-cap">SPACE</span> Trigger Pad</span>
          <span class="key-shortcut"><span class="key-cap">M</span> Mute</span>
          <span class="key-shortcut"><span class="key-cap">S</span> Solo</span>
          <span class="key-shortcut"><span class="key-cap">U</span> Undo</span>
          <span class="key-shortcut"><span class="key-cap">C</span> Clear</span>
          <span class="key-shortcut"><span class="key-cap">ESC</span> Master Stop</span>
        </div>
        <div class="footer-spec">
          <span>48.0 kHz 32-BIT FLOAT</span>
          <span class="spec-divider">•</span>
          <span>LOCK-FREE SPSC PIPELINE</span>
          <span class="spec-divider">•</span>
          <span id="latency-display">~5.3ms ROUND-TRIP</span>
        </div>
      </footer>
    </div>
  </body>
</html>
